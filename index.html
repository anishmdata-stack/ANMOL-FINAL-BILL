<script data-anmol-local-save>
(function(){
  var origFetch = window.fetch;
  function colKey(c){ return 'anmol_local_records_'+c; }
  function load(c){ try{ return JSON.parse(localStorage.getItem(colKey(c))||'[]'); }catch(e){ return []; } }
  function save(c,arr){ try{ localStorage.setItem(colKey(c), JSON.stringify(arr)); }catch(e){} }
  function keyKey(c,k){ return 'anmol_local_idem_'+c+'_'+k; }
  function resp(obj){ return new Response(JSON.stringify(obj), {status:200, headers:{'content-type':'application/json'}}); }
  window.fetch = function(input, init){
    var url = (typeof input==='string') ? input : (input && input.url) || '';
    // Only intercept the app's own save service
    if (url === 'actions' || String(url).endsWith('/actions')) {
      try{
        var body = {};
        if (init && init.body) body = JSON.parse(init.body);
        else if (input && input.body) body = JSON.parse(input.body);
        var action = body.action, args = body.args || {};
        var coll = args.collection || 'default';
        var rows = load(coll);
        if (action === 'records.list'){
          var out = rows.slice();
          if (args.limit) out = out.slice(0, args.limit);
          try{ out = JSON.parse(JSON.stringify(out).split('Asli Bill').join('ANISHHUSEN')); }catch(e){} return Promise.resolve(resp({data:{records: out}}));
        }
        if (action === 'records.create'){
          if (args.idempotency_key){
            var prev = localStorage.getItem(keyKey(coll, args.idempotency_key));
            if (prev) return Promise.resolve(resp({data:{id: prev}}));
          }
          var id = 'local-' + Date.now() + '-' + Math.floor(Math.random()*100000);
          rows.push({id:id, value: args.value});
          save(coll, rows);
          if (args.idempotency_key) { try{ localStorage.setItem(keyKey(coll, args.idempotency_key), id); }catch(e){} }
          return Promise.resolve(resp({data:{id:id}}));
        }
        if (action === 'records.replace'){
          var found = false;
          rows = rows.map(function(r){ if(String(r.id)===String(args.id)){ found=true; return {id:r.id, value: args.value}; } return r; });
          if(!found) rows.push({id:args.id, value: args.value});
          save(coll, rows);
          return Promise.resolve(resp({data:{id:args.id}}));
        }
        if (action === 'records.delete'){
          rows = rows.filter(function(r){ return String(r.id)!==String(args.id); });
          save(coll, rows);
          return Promise.resolve(resp({data:{ok:true}}));
        }
        if (action === 'records.get'){
          var one = rows.filter(function(r){ return String(r.id)===String(args.id); })[0] || null;
          return Promise.resolve(resp({data: one}));
        }
        return Promise.resolve(resp({data:{}}));
      }catch(e){
        return Promise.resolve(resp({error: String(e && e.message || e)}));
      }
    }
    return origFetch.apply(this, arguments);
  };
  window.__anmolLocalSave = true;
})();
